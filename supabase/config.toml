# Supabase local development config (supabase CLI). Docs: https://supabase.com/docs/guides/cli/config
project_id = "tape-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are created/invited by admin only; no public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 5
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.sms]
enable_signup = false

[analytics]
enabled = false
